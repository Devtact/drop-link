<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AirGap Drop — Optical QR Data Bridge</title>
  <!-- Fast QR Generator -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <!-- Real-time QR Scanner -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2e;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
    .card { background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 1rem; width: 100%; max-width: 480px; padding: 2rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); text-align: center; }
    .badge { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.6rem; border-radius: 999px; background: rgba(16, 185, 129, 0.12); color: var(--success); margin-bottom: 1rem; }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.4rem; }
    p { font-size: 0.88rem; color: var(--muted); line-height: 1.4; margin-bottom: 1.5rem; }
    
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; background: rgba(0,0,0,0.2); padding: 0.3rem; border-radius: 0.5rem; }
    .tab-btn { flex: 1; padding: 0.6rem; border: none; background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; border-radius: 0.35rem; transition: 0.2s; }
    .tab-btn.active { background: var(--accent); color: #000; }

    .drop-zone { border: 2px dashed rgba(255,255,255,0.2); border-radius: 0.75rem; padding: 2rem 1rem; cursor: pointer; position: relative; margin-bottom: 1rem; }
    .drop-zone:hover { border-color: var(--accent); }
    input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    #qrCanvas { width: 320px; height: 320px; background: #fff; border-radius: 0.5rem; margin: 1rem auto; display: none; }
    #videoPreview { width: 100%; max-height: 280px; border-radius: 0.5rem; object-fit: cover; background: #000; display: none; }

    .progress-bar-wrap { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden; margin: 1rem 0; display: none; }
    .progress-bar { width: 0%; height: 100%; background: var(--success); transition: width 0.1s linear; }

    .btn { display: block; width: 100%; padding: 0.75rem; background: var(--accent); color: #000; font-weight: 600; text-align: center; border-radius: 0.5rem; border: none; cursor: pointer; text-decoration: none; margin-top: 1rem; font-size: 0.95rem; }
    .btn:hover { background: var(--accent-hover); }
    .status-text { font-size: 0.85rem; color: var(--muted); margin-top: 0.5rem; }
  </style>
</head>
<body>

<div class="card">
  <div class="badge">📡 Air-Gapped Optical Transfer</div>
  <h1>AirGap Bridge</h1>
  <p>Exchange files between devices through dynamic optical video QR streaming. Zero network traffic.</p>

  <div class="tabs">
    <button class="tab-btn active" id="tabSender">Send (Display QR)</button>
    <button class="tab-btn" id="tabReceiver">Receive (Scan Cam)</button>
  </div>

  <!-- SENDER TAB -->
  <div id="senderView">
    <div class="drop-zone" id="dropArea">
      <input type="file" id="fileInput" />
      <div id="dropLabel">Click or drop file (Images / Docs &le; 1–2 MB)</div>
    </div>
    <canvas id="qrCanvas"></canvas>
    <div id="senderStatus" class="status-text"></div>
  </div>

  <!-- RECEIVER TAB -->
  <div id="receiverView" style="display: none;">
    <button class="btn" id="startCamBtn">Enable Camera & Scan</button>
    <video id="videoPreview" playsinline></video>
    <canvas id="scannerBuffer" style="display: none;"></canvas>
    
    <div class="progress-bar-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div id="receiverStatus" class="status-text">Camera inactive.</div>
    <a id="downloadBtn" class="btn" style="display: none; background: var(--success); color: #fff;">Download File</a>
  </div>
</div>

<script>
  // UI Tabs Switcher
  const tabSender = document.getElementById('tabSender');
  const tabReceiver = document.getElementById('tabReceiver');
  const senderView = document.getElementById('senderView');
  const receiverView = document.getElementById('receiverView');

  tabSender.onclick = () => {
    tabSender.classList.add('active');
    tabReceiver.classList.remove('active');
    senderView.style.display = 'block';
    receiverView.style.display = 'none';
    stopCamera();
  };

  tabReceiver.onclick = () => {
    tabReceiver.classList.add('active');
    tabSender.classList.remove('active');
    senderView.style.display = 'none';
    receiverView.style.display = 'block';
    clearInterval(qrInterval);
  };

  // --- SENDER ENGINE ---
  const fileInput = document.getElementById('fileInput');
  const dropLabel = document.getElementById('dropLabel');
  const qrCanvas = document.getElementById('qrCanvas');
  const senderStatus = document.getElementById('senderStatus');
  let qrInterval = null;

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    dropLabel.textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
    senderStatus.textContent = "Slicing file into optical frames...";
    qrCanvas.style.display = 'block';

    const buffer = await file.arrayBuffer();
    const bytes = new Uint8Array(buffer);
    let binaryStr = '';
    for (let i = 0; i < bytes.length; i++) binaryStr += String.fromCharCode(bytes[i]);
    const base64Data = btoa(binaryStr);

    // Split base64 payload into optimal ~550 character chunks for smooth optical read
    const CHUNK_SIZE = 550;
    const totalChunks = Math.ceil(base64Data.length / CHUNK_SIZE);
    const fileId = Math.random().toString(36).substring(2, 6);
    const chunks = [];

    for (let i = 0; i < totalChunks; i++) {
      const part = base64Data.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
      // Frame packet format: [fileId]|[chunkIndex]|[totalChunks]|[fileName]|[fileType]|[data]
      const packet = `${fileId}|${i}|${totalChunks}|${encodeURIComponent(file.name)}|${encodeURIComponent(file.type || 'application/octet-stream')}|${part}`;
      chunks.push(packet);
    }

    let currentFrame = 0;
    clearInterval(qrInterval);

    // Loop cycle frames at ~10 FPS
    qrInterval = setInterval(() => {
      const packet = chunks[currentFrame];
      QRCode.toCanvas(qrCanvas, packet, {
        errorCorrectionLevel: 'L',
        margin: 1,
        width: 320
      });

      senderStatus.textContent = `Streaming optical frame: ${currentFrame + 1} / ${totalChunks}`;
      currentFrame = (currentFrame + 1) % totalChunks;
    }, 100);
  });

  // --- RECEIVER ENGINE ---
  const startCamBtn = document.getElementById('startCamBtn');
  const video = document.getElementById('videoPreview');
  const scannerBuffer = document.getElementById('scannerBuffer');
  const bufferCtx = scannerBuffer.getContext('2d');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  const receiverStatus = document.getElementById('receiverStatus');
  const downloadBtn = document.getElementById('downloadBtn');

  let stream = null;
  let activeTransfer = {
    fileId: null,
    fileName: null,
    fileType: null,
    totalChunks: 0,
    collected: new Map()
  };

  startCamBtn.onclick = async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      video.srcObject = stream;
      video.setAttribute("playsinline", true);
      video.style.display = "block";
      startCamBtn.style.display = "none";
      progressWrap.style.display = "block";
      video.play();
      requestAnimationFrame(scanVideoTick);
      receiverStatus.textContent = "Point camera at the animated QR code...";
    } catch (err) {
      receiverStatus.textContent = "Camera access denied or unavailable.";
    }
  };

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }
    video.style.display = "none";
    startCamBtn.style.display = "block";
  }

  function scanVideoTick() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      scannerBuffer.height = video.videoHeight;
      scannerBuffer.width = video.videoWidth;
      bufferCtx.drawImage(video, 0, 0, scannerBuffer.width, scannerBuffer.height);

      const imageData = bufferCtx.getImageData(0, 0, scannerBuffer.width, scannerBuffer.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, {
        inversionAttempts: "dontInvert"
      });

      if (code && code.data) {
        parseScannedPacket(code.data);
      }
    }
    if (stream) {
      requestAnimationFrame(scanVideoTick);
    }
  }

  function parseScannedPacket(raw) {
    const parts = raw.split('|');
    if (parts.length !== 6) return;

    const [fileId, chunkIdxStr, totalStr, fileName, fileType, chunkData] = parts;
    const chunkIdx = parseInt(chunkIdxStr, 10);
    const totalChunks = parseInt(totalStr, 10);

    // Initialize or reset session if new file detected
    if (activeTransfer.fileId !== fileId) {
      activeTransfer = {
        fileId: fileId,
        fileName: decodeURIComponent(fileName),
        fileType: decodeURIComponent(fileType),
        totalChunks: totalChunks,
        collected: new Map()
      };
    }

    if (!activeTransfer.collected.has(chunkIdx)) {
      activeTransfer.collected.set(chunkIdx, chunkData);
      
      const count = activeTransfer.collected.size;
      const pct = Math.round((count / activeTransfer.totalChunks) * 100);
      progressBar.style.width = `${pct}%`;
      receiverStatus.textContent = `Receiving: ${count} / ${activeTransfer.totalChunks} frames (${pct}%)`;

      // When all frames are collected
      if (count === activeTransfer.totalChunks) {
        assembleAndDownload();
      }
    }
  }

  function assembleAndDownload() {
    stopCamera();
    receiverStatus.textContent = `✅ Successfully reassembled ${activeTransfer.fileName}!`;

    // Stitch chunks together in order
    let fullBase64 = '';
    for (let i = 0; i < activeTransfer.totalChunks; i++) {
      fullBase64 += activeTransfer.collected.get(i);
    }

    // Convert Base64 back to binary Blob
    const binary = atob(fullBase64);
    const len = binary.length;
    const u8 = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      u8[i] = binary.charCodeAt(i);
    }

    const blob = new Blob([u8], { type: activeTransfer.fileType });
    const downloadUrl = URL.createObjectURL(blob);

    downloadBtn.href = downloadUrl;
    downloadBtn.download = activeTransfer.fileName;
    downloadBtn.textContent = `Save ${activeTransfer.fileName}`;
    downloadBtn.style.display = 'block';
  }
</script>
</body>
</html>
