<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AirGap Drop — Optical QR Bridge</title>
  <!-- Fast QR Generator -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <!-- Real-time QR Scanner -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2e;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
    .card { background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 1rem; width: 100%; max-width: 500px; padding: 2rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); text-align: center; }
    .badge { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.6rem; border-radius: 999px; background: rgba(16, 185, 129, 0.12); color: var(--success); margin-bottom: 1rem; }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.4rem; }
    p { font-size: 0.88rem; color: var(--muted); line-height: 1.4; margin-bottom: 1.5rem; }
    
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; background: rgba(0,0,0,0.2); padding: 0.3rem; border-radius: 0.5rem; }
    .tab-btn { flex: 1; padding: 0.6rem; border: none; background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; border-radius: 0.35rem; transition: 0.2s; }
    .tab-btn.active { background: var(--accent); color: #000; }

    .drop-zone { border: 2px dashed rgba(255,255,255,0.2); border-radius: 0.75rem; padding: 2rem 1rem; cursor: pointer; position: relative; margin-bottom: 1rem; }
    .drop-zone:hover { border-color: var(--accent); }
    input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    #qrCanvas { width: 300px; height: 300px; background: #fff; border-radius: 0.5rem; margin: 1rem auto; display: none; }
    #videoPreview { width: 100%; max-height: 280px; border-radius: 0.5rem; object-fit: contain; background: #000; display: none; }

    .btn-group { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .btn { display: block; width: 100%; padding: 0.75rem; background: var(--accent); color: #000; font-weight: 600; text-align: center; border-radius: 0.5rem; border: none; cursor: pointer; text-decoration: none; font-size: 0.9rem; transition: 0.2s; }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }

    .progress-bar-wrap { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden; margin: 1rem 0; display: none; }
    .progress-bar { width: 0%; height: 100%; background: var(--success); transition: width 0.1s linear; }

    .status-text { font-size: 0.85rem; color: var(--muted); margin-top: 0.5rem; }
  </style>
</head>
<body>

<div class="card">
  <div class="badge">📡 Air-Gapped Optical Transfer</div>
  <h1>AirGap Bridge</h1>
  <p>Exchange files through dynamic optical QR video streams. 100% offline and proxy-safe.</p>

  <div class="tabs">
    <button class="tab-btn active" id="tabSender">Send (Display QR)</button>
    <button class="tab-btn" id="tabReceiver">Receive (Scan / Capture)</button>
  </div>

  <!-- SENDER VIEW -->
  <div id="senderView">
    <div class="drop-zone" id="dropArea">
      <input type="file" id="fileInput" />
      <div id="dropLabel">Click or drop file here (&le; 1–2 MB)</div>
    </div>
    <canvas id="qrCanvas"></canvas>
    <div id="senderStatus" class="status-text"></div>
  </div>

  <!-- RECEIVER VIEW -->
  <div id="receiverView" style="display: none;">
    <div class="btn-group" id="captureOptions">
      <button class="btn" id="startCamBtn">📷 Scan via Camera</button>
      <button class="btn btn-secondary" id="startScreenBtn">🖥️ Capture Screen / Tab</button>
    </div>

    <video id="videoPreview" playsinline></video>
    <canvas id="scannerBuffer" style="display: none;"></canvas>
    
    <div class="progress-bar-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div id="receiverStatus" class="status-text">Select Camera or Screen Share to begin.</div>
    <a id="downloadBtn" class="btn" style="display: none; background: var(--success); color: #fff; margin-top: 1rem;">Download File</a>
  </div>
</div>

<script>
  // Tabs Switcher
  const tabSender = document.getElementById('tabSender');
  const tabReceiver = document.getElementById('tabReceiver');
  const senderView = document.getElementById('senderView');
  const receiverView = document.getElementById('receiverView');

  tabSender.onclick = () => {
    tabSender.classList.add('active');
    tabReceiver.classList.remove('active');
    senderView.style.display = 'block';
    receiverView.style.display = 'none';
    stopMediaStream();
  };

  tabReceiver.onclick = () => {
    tabReceiver.classList.add('active');
    tabSender.classList.remove('active');
    senderView.style.display = 'none';
    receiverView.style.display = 'block';
    stopSenderLoop();
  };

  // --- NON-BLOCKING SENDER ---
  const fileInput = document.getElementById('fileInput');
  const dropLabel = document.getElementById('dropLabel');
  const qrCanvas = document.getElementById('qrCanvas');
  const senderStatus = document.getElementById('senderStatus');
  let isLooping = false;

  function stopSenderLoop() {
    isLooping = false;
  }

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    if (file.size > 2 * 1024 * 1024) {
      alert("Please select a file under 2 MB.");
      return;
    }

    dropLabel.textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
    senderStatus.textContent = "Processing file payload...";
    qrCanvas.style.display = 'block';

    // Native browser FileReader (does not lock main thread)
    const reader = new FileReader();
    reader.onload = async () => {
      // Data URL structure: "data:<mime>;base64,<payload>"
      const dataUrl = reader.result;
      const commaIdx = dataUrl.indexOf(',');
      const base64Data = dataUrl.substring(commaIdx + 1);

      // ~300 chars per frame ensures rapid, effortless optical decoding
      const CHUNK_SIZE = 300;
      const totalChunks = Math.ceil(base64Data.length / CHUNK_SIZE);
      const fileId = Math.random().toString(36).substring(2, 6);
      const chunks = [];

      for (let i = 0; i < totalChunks; i++) {
        const part = base64Data.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
        const packet = `${fileId}|${i}|${totalChunks}|${encodeURIComponent(file.name)}|${encodeURIComponent(file.type || 'application/octet-stream')}|${part}`;
        chunks.push(packet);
      }

      // Start rendering loop safely
      stopSenderLoop();
      isLooping = true;
      runQrLoop(chunks, totalChunks);
    };
    reader.readAsDataURL(file);
  });

  async function runQrLoop(chunks, totalChunks) {
    let index = 0;
    while (isLooping) {
      const packet = chunks[index];
      try {
        await QRCode.toCanvas(qrCanvas, packet, {
          errorCorrectionLevel: 'L',
          margin: 1,
          width: 300
        });
        senderStatus.textContent = `Broadcasting frame ${index + 1} of ${totalChunks} (Looping)`;
      } catch (err) {
        console.error("QR Render error:", err);
      }
      index = (index + 1) % totalChunks;
      // 120ms delay gives scanner adequate time to lock on each frame
      await new Promise(r => setTimeout(r, 120));
    }
  }

  // --- RECEIVER ENGINE (Camera + Screen Capture) ---
  const startCamBtn = document.getElementById('startCamBtn');
  const startScreenBtn = document.getElementById('startScreenBtn');
  const captureOptions = document.getElementById('captureOptions');
  const video = document.getElementById('videoPreview');
  const scannerBuffer = document.getElementById('scannerBuffer');
  const bufferCtx = scannerBuffer.getContext('2d', { willReadFrequently: true });
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  const receiverStatus = document.getElementById('receiverStatus');
  const downloadBtn = document.getElementById('downloadBtn');

  let activeStream = null;
  let activeTransfer = {
    fileId: null,
    fileName: null,
    fileType: null,
    totalChunks: 0,
    collected: new Map()
  };

  startCamBtn.onclick = async () => {
    try {
      activeStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" }
      });
      initMediaStream("Point camera at the animated QR sequence...");
    } catch (err) {
      receiverStatus.textContent = "Camera access denied or unavailable.";
    }
  };

  startScreenBtn.onclick = async () => {
    try {
      activeStream = await navigator.mediaDevices.getDisplayMedia({
        video: { cursor: "never" },
        audio: false
      });
      activeStream.getVideoTracks()[0].addEventListener('ended', () => {
        stopMediaStream();
        receiverStatus.textContent = "Screen capture ended.";
      });
      initMediaStream("Capturing screen... Keep animated QR visible.");
    } catch (err) {
      receiverStatus.textContent = "Screen sharing cancelled.";
    }
  };

  function initMediaStream(msg) {
    video.srcObject = activeStream;
    video.setAttribute("playsinline", true);
    video.style.display = "block";
    captureOptions.style.display = "none";
    progressWrap.style.display = "block";
    downloadBtn.style.display = "none";
    video.play();
    receiverStatus.textContent = msg;
    requestAnimationFrame(scanVideoTick);
  }

  function stopMediaStream() {
    if (activeStream) {
      activeStream.getTracks().forEach(t => t.stop());
      activeStream = null;
    }
    video.style.display = "none";
    captureOptions.style.display = "flex";
  }

  function scanVideoTick() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      const scale = Math.min(1, 800 / video.videoWidth);
      scannerBuffer.width = video.videoWidth * scale;
      scannerBuffer.height = video.videoHeight * scale;

      bufferCtx.drawImage(video, 0, 0, scannerBuffer.width, scannerBuffer.height);

      const imgData = bufferCtx.getImageData(0, 0, scannerBuffer.width, scannerBuffer.height);
      const code = jsQR(imgData.data, imgData.width, imgData.height, {
        inversionAttempts: "dontInvert"
      });

      if (code && code.data) {
        parseScannedPacket(code.data);
      }
    }
    if (activeStream) {
      requestAnimationFrame(scanVideoTick);
    }
  }

  function parseScannedPacket(raw) {
    const parts = raw.split('|');
    if (parts.length !== 6) return;

    const [fileId, chunkIdxStr, totalStr, fileName, fileType, chunkData] = parts;
    const chunkIdx = parseInt(chunkIdxStr, 10);
    const totalChunks = parseInt(totalStr, 10);

    if (activeTransfer.fileId !== fileId) {
      activeTransfer = {
        fileId: fileId,
        fileName: decodeURIComponent(fileName),
        fileType: decodeURIComponent(fileType),
        totalChunks: totalChunks,
        collected: new Map()
      };
    }

    if (!activeTransfer.collected.has(chunkIdx)) {
      activeTransfer.collected.set(chunkIdx, chunkData);
      
      const count = activeTransfer.collected.size;
      const pct = Math.round((count / activeTransfer.totalChunks) * 100);
      progressBar.style.width = `${pct}%`;
      receiverStatus.textContent = `Captured: ${count} / ${activeTransfer.totalChunks} frames (${pct}%)`;

      if (count === activeTransfer.totalChunks) {
        assembleAndDownload();
      }
    }
  }

  function assembleAndDownload() {
    stopMediaStream();
    receiverStatus.textContent = `✅ Successfully reassembled ${activeTransfer.fileName}!`;

    let fullBase64 = '';
    for (let i = 0; i < activeTransfer.totalChunks; i++) {
      fullBase64 += activeTransfer.collected.get(i);
    }

    const binary = atob(fullBase64);
    const len = binary.length;
    const u8 = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      u8[i] = binary.charCodeAt(i);
    }

    const blob = new Blob([u8], { type: activeTransfer.fileType });
    const downloadUrl = URL.createObjectURL(blob);

    downloadBtn.href = downloadUrl;
    downloadBtn.download = activeTransfer.fileName;
    downloadBtn.textContent = `Save ${activeTransfer.fileName}`;
    downloadBtn.style.display = 'block';
  }
</script>
</body>
</html>
