<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AirGap Drop — Optical QR Bridge</title>
  <!-- Fast QR Generator -->
 <!-- 1. The Generator (Fixes the QRCode is not defined error) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>

<!-- 2. The Scanner (Use the stable 1.4.0 version for better video frame reading) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2e;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
    .card { background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 1rem; width: 100%; max-width: 500px; padding: 2rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); text-align: center; }
    .badge { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.6rem; border-radius: 999px; background: rgba(16, 185, 129, 0.12); color: var(--success); margin-bottom: 1rem; }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.4rem; }
    p { font-size: 0.88rem; color: var(--muted); line-height: 1.4; margin-bottom: 1.5rem; }
    
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; background: rgba(0,0,0,0.2); padding: 0.3rem; border-radius: 0.5rem; }
    .tab-btn { flex: 1; padding: 0.6rem; border: none; background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; border-radius: 0.35rem; transition: 0.2s; }
    .tab-btn.active { background: var(--accent); color: #000; }

    .drop-zone { border: 2px dashed rgba(255,255,255,0.2); border-radius: 0.75rem; padding: 2rem 1rem; cursor: pointer; position: relative; margin-bottom: 1rem; transition: 0.2s; }
    .drop-zone:hover { border-color: var(--accent); }
    input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    #qrImage { width: 320px; height: 320px; background: #fff; border-radius: 0.5rem; margin: 1rem auto; display: none; object-fit: contain; }
    #videoPreview { width: 100%; max-height: 300px; border-radius: 0.5rem; object-fit: contain; background: #000; display: none; margin-bottom: 1rem; }

    .btn-group { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .btn { display: block; width: 100%; padding: 0.75rem; background: var(--accent); color: #000; font-weight: 600; text-align: center; border-radius: 0.5rem; border: none; cursor: pointer; text-decoration: none; font-size: 0.9rem; transition: 0.2s; }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }

    .progress-bar-wrap { width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden; margin: 1rem 0; display: none; }
    .progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.1s linear; }

    .status-text { font-size: 0.85rem; color: var(--muted); margin-top: 0.5rem; font-variant-numeric: tabular-nums; }
    
    .controls { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-top: 1rem; font-size: 0.85rem; color: var(--muted); display: none; }
    input[type="range"] { accent-color: var(--accent); cursor: pointer; }
  </style>
</head>
<body>

<div class="card">
  <div class="badge">📡 Air-Gapped Optical Transfer</div>
  <h1>AirGap Bridge</h1>
  <p>Exchange files using animated QR codes. 100% offline, proxy-safe, and untraceable.</p>

  <div class="tabs">
    <button class="tab-btn active" id="tabSender">Send File</button>
    <button class="tab-btn" id="tabReceiver">Receive File</button>
  </div>

  <!-- SENDER VIEW -->
  <div id="senderView">
    <div class="drop-zone" id="dropArea">
      <input type="file" id="fileInput" />
      <div id="dropLabel">Click or drop file here (&le; 1 MB recommended)</div>
    </div>
    
    <div class="progress-bar-wrap" id="encodeProgressWrap">
      <div class="progress-bar" id="encodeProgressBar"></div>
    </div>
    
    <img id="qrImage" alt="Animated QR Stream" />
    
    <div class="controls" id="playbackControls">
      <label>Speed: <span id="fpsLabel">10</span> FPS</label>
      <input type="range" id="fpsSlider" min="2" max="20" value="10" />
    </div>

    <div id="senderStatus" class="status-text"></div>
  </div>

  <!-- RECEIVER VIEW -->
  <div id="receiverView" style="display: none;">
    <div class="btn-group" id="captureOptions">
      <button class="btn" id="startCamBtn">📷 Scan Camera</button>
      <button class="btn btn-secondary" id="startScreenBtn">🖥️ Capture Screen</button>
    </div>

    <video id="videoPreview" playsinline></video>
    <canvas id="scannerBuffer" style="display: none;"></canvas>
    
    <div class="progress-bar-wrap" id="receiveProgressWrap">
      <div class="progress-bar" id="receiveProgressBar" style="background: var(--success);"></div>
    </div>
    
    <div id="receiverStatus" class="status-text">Select Camera or Screen Share to begin.</div>
    <a id="downloadBtn" class="btn" style="display: none; background: var(--success); color: #fff; margin-top: 1rem;">Download File</a>
  </div>
</div>

<script>
  // Tabs Navigation
  const tabSender = document.getElementById('tabSender');
  const tabReceiver = document.getElementById('tabReceiver');
  const senderView = document.getElementById('senderView');
  const receiverView = document.getElementById('receiverView');

  tabSender.onclick = () => {
    tabSender.classList.add('active');
    tabReceiver.classList.remove('active');
    senderView.style.display = 'block';
    receiverView.style.display = 'none';
    stopMediaStream();
  };

  tabReceiver.onclick = () => {
    tabReceiver.classList.add('active');
    tabSender.classList.remove('active');
    senderView.style.display = 'none';
    receiverView.style.display = 'block';
    stopSenderPlayback();
  };

  // --- SENDER: PRE-COMPUTED PLAYBACK ---
  const fileInput = document.getElementById('fileInput');
  const dropLabel = document.getElementById('dropLabel');
  const qrImage = document.getElementById('qrImage');
  const senderStatus = document.getElementById('senderStatus');
  const encodeProgressWrap = document.getElementById('encodeProgressWrap');
  const encodeProgressBar = document.getElementById('encodeProgressBar');
  const playbackControls = document.getElementById('playbackControls');
  const fpsSlider = document.getElementById('fpsSlider');
  const fpsLabel = document.getElementById('fpsLabel');
  
  let playbackInterval = null;
  let cachedFrames = [];
  let currentFps = 10;

  function stopSenderPlayback() {
    if (playbackInterval) clearInterval(playbackInterval);
  }

  // Generate a single QR data URL wrapped in a Promise to allow UI updates
  function generateQRDataURL(text) {
    return new Promise((resolve, reject) => {
      QRCode.toDataURL(text, { errorCorrectionLevel: 'L', margin: 2, width: 350 }, (err, url) => {
        if (err) reject(err);
        else resolve(url);
      });
    });
  }

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    if (file.size > 2 * 1024 * 1024) {
      alert("File is too large for optical transfer. Keep it under 2 MB.");
      return;
    }

    stopSenderPlayback();
    cachedFrames = [];
    qrImage.style.display = 'none';
    playbackControls.style.display = 'none';
    encodeProgressWrap.style.display = 'block';
    
    dropLabel.textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
    senderStatus.textContent = "Converting to binary chunks...";

    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const dataUrl = reader.result;
        const base64Data = dataUrl.substring(dataUrl.indexOf(',') + 1);

        // 350 chars is the optimal limit for standard webcam matrix density
        const CHUNK_SIZE = 350;
        const totalChunks = Math.ceil(base64Data.length / CHUNK_SIZE);
        const fileId = Math.random().toString(36).substring(2, 6);

        senderStatus.textContent = `Pre-rendering ${totalChunks} frames...`;

        // Pre-compute all QR code images so playback is perfectly smooth
        for (let i = 0; i < totalChunks; i++) {
          const part = base64Data.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
          const packet = `${fileId}|${i}|${totalChunks}|${encodeURIComponent(file.name)}|${encodeURIComponent(file.type || 'application/octet-stream')}|${part}`;
          
          const frameUrl = await generateQRDataURL(packet);
          cachedFrames.push(frameUrl);
          
          // Update progress bar without freezing UI
          const pct = Math.round(((i + 1) / totalChunks) * 100);
          encodeProgressBar.style.width = `${pct}%`;
          
          // Yield to main thread every 10 frames to keep browser responsive
          if (i % 10 === 0) await new Promise(r => setTimeout(r, 0));
        }

        // Setup Playback
        encodeProgressWrap.style.display = 'none';
        qrImage.style.display = 'block';
        playbackControls.style.display = 'flex';
        startPlaybackLoop();

      } catch (err) {
        console.error(err);
        senderStatus.textContent = "Error encoding file. Try a smaller file.";
        senderStatus.style.color = "var(--danger)";
      }
    };
    reader.readAsDataURL(file);
  });

  fpsSlider.addEventListener('input', (e) => {
    currentFps = parseInt(e.target.value, 10);
    fpsLabel.textContent = currentFps;
    if (cachedFrames.length > 0) {
      startPlaybackLoop();
    }
  });

  function startPlaybackLoop() {
    stopSenderPlayback();
    let frameIdx = 0;
    
    // Smooth image swapping (Zero CPU calculation required here)
    playbackInterval = setInterval(() => {
      qrImage.src = cachedFrames[frameIdx];
      senderStatus.textContent = `Broadcasting frame: ${frameIdx + 1} / ${cachedFrames.length}`;
      frameIdx = (frameIdx + 1) % cachedFrames.length;
    }, 1000 / currentFps);
  }


  // --- RECEIVER: SCAN & ASSEMBLE ---
  const startCamBtn = document.getElementById('startCamBtn');
  const startScreenBtn = document.getElementById('startScreenBtn');
  const captureOptions = document.getElementById('captureOptions');
  const video = document.getElementById('videoPreview');
  const scannerBuffer = document.getElementById('scannerBuffer');
  const bufferCtx = scannerBuffer.getContext('2d', { willReadFrequently: true });
  const receiveProgressWrap = document.getElementById('receiveProgressWrap');
  const receiveProgressBar = document.getElementById('receiveProgressBar');
  const receiverStatus = document.getElementById('receiverStatus');
  const downloadBtn = document.getElementById('downloadBtn');

  let activeStream = null;
  let animationFrameId = null;
  let activeTransfer = { fileId: null, fileName: null, fileType: null, totalChunks: 0, collected: new Map() };

  startCamBtn.onclick = async () => {
    try {
      activeStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1080 } }
      });
      initReceiver("Point camera at the animated QR sequence...");
    } catch (err) {
      receiverStatus.textContent = "Camera access denied.";
    }
  };

  startScreenBtn.onclick = async () => {
    try {
      activeStream = await navigator.mediaDevices.getDisplayMedia({
        video: { cursor: "never" }, audio: false
      });
      activeStream.getVideoTracks()[0].addEventListener('ended', stopMediaStream);
      initReceiver("Capturing screen... Bring the QR sequence into view.");
    } catch (err) {
      receiverStatus.textContent = "Screen capture cancelled.";
    }
  };

  function initReceiver(msg) {
    video.srcObject = activeStream;
    video.style.display = "block";
    captureOptions.style.display = "none";
    receiveProgressWrap.style.display = "block";
    downloadBtn.style.display = "none";
    video.play();
    receiverStatus.textContent = msg;
    animationFrameId = requestAnimationFrame(scanVideoTick);
  }

  function stopMediaStream() {
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    if (activeStream) activeStream.getTracks().forEach(t => t.stop());
    activeStream = null;
    video.style.display = "none";
    captureOptions.style.display = "flex";
  }

  function scanVideoTick() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      // Downscale to max 800px width to keep jsqr CPU usage low
      const scale = Math.min(1, 800 / video.videoWidth);
      scannerBuffer.width = video.videoWidth * scale;
      scannerBuffer.height = video.videoHeight * scale;

      bufferCtx.drawImage(video, 0, 0, scannerBuffer.width, scannerBuffer.height);
      const imgData = bufferCtx.getImageData(0, 0, scannerBuffer.width, scannerBuffer.height);
      
      const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });

      if (code && code.data) {
        parseScannedPacket(code.data);
      }
    }
    if (activeStream) {
      animationFrameId = requestAnimationFrame(scanVideoTick);
    }
  }

  function parseScannedPacket(raw) {
    const parts = raw.split('|');
    if (parts.length !== 6) return;

    const [fileId, chunkIdxStr, totalStr, fileName, fileType, chunkData] = parts;
    const chunkIdx = parseInt(chunkIdxStr, 10);
    const totalChunks = parseInt(totalStr, 10);

    // If we detect a new file sequence, reset the memory
    if (activeTransfer.fileId !== fileId) {
      activeTransfer = {
        fileId: fileId,
        fileName: decodeURIComponent(fileName),
        fileType: decodeURIComponent(fileType),
        totalChunks: totalChunks,
        collected: new Map()
      };
      receiveProgressBar.style.width = '0%';
    }

    // Only process chunks we haven't successfully scanned yet
    if (!activeTransfer.collected.has(chunkIdx)) {
      activeTransfer.collected.set(chunkIdx, chunkData);
      
      const count = activeTransfer.collected.size;
      const pct = Math.round((count / activeTransfer.totalChunks) * 100);
      
      receiveProgressBar.style.width = `${pct}%`;
      receiverStatus.textContent = `Captured: ${count} / ${activeTransfer.totalChunks} frames (${pct}%)`;

      if (count === activeTransfer.totalChunks) {
        assembleAndDownload();
      }
    }
  }

  function assembleAndDownload() {
    stopMediaStream();
    receiverStatus.textContent = `✅ Assembled: ${activeTransfer.fileName}`;

    let fullBase64 = '';
    for (let i = 0; i < activeTransfer.totalChunks; i++) {
      fullBase64 += activeTransfer.collected.get(i);
    }

    const binary = atob(fullBase64);
    const u8 = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      u8[i] = binary.charCodeAt(i);
    }

    const blob = new Blob([u8], { type: activeTransfer.fileType });
    const downloadUrl = URL.createObjectURL(blob);

    downloadBtn.href = downloadUrl;
    downloadBtn.download = activeTransfer.fileName;
    downloadBtn.textContent = `Save ${activeTransfer.fileName}`;
    downloadBtn.style.display = 'block';
  }
</script>
</body>
</html>
